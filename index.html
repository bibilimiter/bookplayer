<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookPlayer</title>
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BookPlayer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<!-- PDF のページを絵にする部品（pdf.js）。一度読みこむと、サービスワーカーがしまっておくので、次からはネットなしで動く -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

<!-- 本棚 -->
<section id="library" class="view">
  <header class="bar">
    <h1>BookPlayer</h1>
    <label class="btn primary" for="fileInput">＋ 本を追加</label>
    <input id="fileInput" type="file" accept=".zip,application/zip" hidden>
  </header>
  <p id="libHint" class="hint">VoiceBook の「スマホ用にまとめる」で作った「<書名>.book.zip」を選んでください。<br>本はこの端末の中にしまうので、次からはネットなしで聞けます。</p>
  <div id="books" class="books"></div>
  <p id="storage" class="small"></p>
</section>

<!-- 再生 -->
<section id="player" class="view" hidden>
  <header class="bar">
    <button id="btnBack" class="btn icon" aria-label="本棚へ">‹</button>
    <div class="titles">
      <div id="bookTitle" class="booktitle"></div>
      <select id="trackSel" aria-label="章"></select>
    </div>
    <button id="btnMenu" class="btn icon" aria-label="設定">⚙</button>
  </header>

  <div id="stage">
    <div id="pages"></div>
    <button id="navPrev" class="nav left" aria-label="次のページ">‹</button>
    <button id="navNext" class="nav right" aria-label="前のページ">›</button>
    <div id="pageInfo"></div>
    <div id="loading" hidden>読みこんでいます…</div>
  </div>

  <div id="panel">
    <div id="line"></div>
    <div class="seekrow">
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="位置">
      <span id="time">0:00 / 0:00</span>
    </div>
    <div class="ctrl">
      <button id="btnPrevS" class="btn" aria-label="前の文">⏮</button>
      <button id="btnBack15" class="btn" aria-label="15秒もどる">−15</button>
      <button id="btnPlay" class="btn primary play" aria-label="再生">▶</button>
      <button id="btnFwd30" class="btn" aria-label="30秒すすむ">＋30</button>
      <button id="btnNextS" class="btn" aria-label="次の文">⏭</button>
    </div>
  </div>

  <div id="menu" hidden>
    <div class="menubox">
      <h2>設定</h2>
      <label>速さ
        <select id="speedSel">
          <option>0.8</option><option>0.9</option><option selected>1.0</option><option>1.1</option><option>1.2</option>
          <option>1.3</option><option>1.5</option><option>1.75</option><option>2.0</option>
        </select>
      </label>
      <label>音量 <input id="vol" type="range" min="0" max="100" value="100"> <span id="volN">100%</span></label>
      <p class="small" id="volNote">iPad と iPhone では、音量は本体のボタンで変えます。</p>
      <label>見せ方
        <select id="hlSel">
          <option value="dim">まわりを暗くするだけ</option>
          <option value="line">横に太い線</option>
          <option value="pale">うすい蛍光ペン</option>
          <option value="dimpen">まわりを暗く＋蛍光ペン</option>
        </select>
      </label>
      <label>ページ
        <select id="spreadSel">
          <option value="auto">横向きのときは2ページ</option>
          <option value="one">いつも1ページ</option>
        </select>
      </label>
      <button id="btnMenuClose" class="btn primary">閉じる</button>
    </div>
  </div>
  <audio id="audio" preload="auto"></audio>
</section>

<script src="app.js"></script>
</body>
</html>
